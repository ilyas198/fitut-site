<body>

  <div id="site-header"></div>

  <main id="contenu">

  <!-- ============ INTRO (LOT 5a, §24) ============ -->
  <section class="editions-intro registre-encre">
    <div class="grille-regie">
      <div class="marge-regie"><p class="surtitre">19 éditions</p></div>
      <div class="contenu-regie apparition">
        <!-- Traduction arabe candidate, non validée par un locuteur natif —
             à faire relire par le comité avant mise en ligne. Ne pas
             considérer comme acquise (voir CLAUDE.md §7). -->
        <h1 class="titre-bilingue">
          <span lang="fr">Nos Éditions</span>
          <span lang="ar" dir="rtl">دوراتنا</span><!-- [traduction à valider] -->
        </h1>
        <p class="editions-intro-texte">Depuis 2007, le FITUT a accueilli plus de 200 troupes venues de plus de 20 pays. Dix-neuf éditions, de la plus récente à la première.</p>
      </div>
    </div>
  </section>

  <!-- ============ BANDE HORIZONTALE D'AFFICHES (LOT 5 révisé, §24) ============
       Plus de 6 entrées : bande horizontale plutôt qu'une frise
       verticale, qui enterrerait les éditions anciennes sous le
       défilement. Rendu entièrement par assets/js/editions.js
       (renderBande) depuis data/editions.json : rien de codé en dur
       ici, y compris le filet de progression sous la bande. Chaque
       entrée est un lien entier vers edition.html — pas de panneau ni
       de modale, qui dupliquerait une page déjà indexable. -->
  <section class="bande-editions registre-encre" aria-label="Chronologie des éditions">
    <div id="editions-grid" aria-live="polite">
      <p class="loading-msg">Chargement des éditions…</p>
    </div>
  </section>

  </main>

  <footer id="site-footer" class="site-footer registre-encre"></footer>

  <script src="partials.js"></script>
  <script src="assets/js/editions.js"></script>
  <script src="main.js"></script>
</body>
